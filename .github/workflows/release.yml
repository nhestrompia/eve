name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build CLI
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          version="${RELEASE_TAG#v}"
          go build -trimpath -ldflags="-s -w -X github.com/nhestrompia/eve.CLIVersion=${version}" -o "dist/eve-${GOOS}-${GOARCH}${suffix}" ./cmd/eve

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eve-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  macos-app:
    name: Build macOS approval app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test approval app
        run: |
          xcodebuild \
            -project macos/EVEApproval/EVEApproval.xcodeproj \
            -scheme EVEApproval \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/eveapproval-derived" \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build approval app
        run: |
          xcodebuild \
            -project macos/EVEApproval/EVEApproval.xcodeproj \
            -scheme EVEApproval \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/eveapproval-derived" \
            build \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/eveapproval-derived/Build/Products/Release/eve.app" dist/eve-macos-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eve-macos-app
          path: dist/eve-macos-app.zip

  publish:
    name: Publish release and npm installer
    needs:
      - release
      - macos-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum eve-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set npm package version
        working-directory: npm/eve
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish npm installer
        working-directory: npm/eve
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
